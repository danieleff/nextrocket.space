name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/danieleff/nextrocket.space:latest .
          docker push ghcr.io/danieleff/nextrocket.space:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The server pins this key to a forced command in root's authorized_keys:
      #   cd /opt/nextrocket && docker compose pull webserver && docker compose up -d webserver && docker image prune -f
      # so no remote command is sent here.
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes root@"$DEPLOY_HOST"
