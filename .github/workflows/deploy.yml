name: Build and deploy

on:
  push:
    branches: [master]
  # Pull requests (including Dependabot's) only build the image as a check;
  # nothing is pushed or deployed.
  pull_request:
  workflow_dispatch:

# master runs queue one after another so deploys never overlap;
# a new push to a PR cancels that PR's previous, now outdated check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Builds everything the Dockerfile does: npm ci, tsc, webpack and the
      # production-only install, so a failing build fails the PR check.
      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t ghcr.io/danieleff/nextrocket.space:latest .

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push ghcr.io/danieleff/nextrocket.space:latest

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The server pins this key to a forced command in root's authorized_keys:
      #   cd /opt/nextrocket && docker compose pull webserver && docker compose up -d webserver && docker image prune -f
      # so no remote command is sent here.
      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          ssh -T -i ~/.ssh/id_deploy -o BatchMode=yes root@"$DEPLOY_HOST"
